<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6657d9"><meta name="description" content="مساحتي — مساحة عربية للملاحظات والمهام">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>مساحتي — Masahati</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#24213a;--muted:#77738d;--accent:#6657d9;--line:#e8e5f2;--soft:#efedff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}.wrap{max-width:960px;margin:auto;padding:22px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:var(--accent);color:white;display:grid;place-items:center;font-size:25px;box-shadow:0 8px 22px #6657d933}.brand h1{font-size:23px;margin:0}.brand p{margin:0;color:var(--muted);font-size:13px}.btn,button{border:0;border-radius:12px;padding:10px 15px;background:var(--accent);color:white;font:inherit;font-weight:650;cursor:pointer}.btn.secondary,button.secondary{background:var(--soft);color:var(--accent)}.hero{padding:24px;border-radius:24px;background:linear-gradient(125deg,#6657d9,#8b7cf0);color:#fff;margin-bottom:18px}.hero h2{margin:0 0 6px;font-size:25px}.hero p{margin:0;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.stat strong{font-size:25px;display:block}.stat span{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#fff;color:var(--muted);border:1px solid var(--line)}.tab.active{background:var(--soft);color:var(--accent);border-color:#d5d0ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel h3{margin:0 0 13px;font-size:18px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;margin-bottom:10px;outline-color:var(--accent)}textarea.field{resize:vertical;min-height:105px}.list{display:grid;gap:9px}.item{border:1px solid var(--line);padding:12px;border-radius:13px;display:flex;gap:10px;align-items:flex-start;background:#fff}.item input{margin-top:7px;accent-color:var(--accent)}.item-main{flex:1;min-width:0;overflow-wrap:anywhere}.item-title{font-weight:650}.item-title.done{text-decoration:line-through;color:var(--muted)}.item small{display:block;color:var(--muted);white-space:pre-wrap}.del{background:transparent;color:#a29db4;padding:3px 7px}.empty{text-align:center;color:var(--muted);padding:20px}.search{margin-bottom:12px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}.hidden{display:none!important}@media(max-width:650px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat,.panel{padding:13px}.head .btn{padding:9px 10px}.hero h2{font-size:22px}}
body.dark{--bg:#171625;--card:#222034;--ink:#f2efff;--muted:#aaa5c3;--line:#38344f;--soft:#302b51}body.dark .item,body.dark .field,body.dark .tab{background:#222034;color:var(--ink)}
</style>
</head>
<body><main class="wrap">
<header class="head"><div class="brand"><div class="logo">م</div><div><h1>مساحتي</h1><p>Masahati · مساحتك للأفكار والإنجاز</p></div></div><button id="theme" class="secondary" aria-label="تبديل المظهر">◐ المظهر</button></header>
<section class="hero"><h2>أهلًا بك في مساحتك ✨</h2><p>اجمع أفكارك، رتّب مهامك، وتقدّم خطوة كل يوم.</p></section>
<section class="stats"><div class="stat"><strong id="notesCount">0</strong><span>ملاحظة</span></div><div class="stat"><strong id="tasksCount">0</strong><span>مهمة</span></div><div class="stat"><strong id="doneCount">0</strong><span>مهمة مكتملة</span></div></section>
<nav class="tabs"><button class="tab active" data-view="all">الكل</button><button class="tab" data-view="notes">ملاحظاتي</button><button class="tab" data-view="tasks">مهامي</button><button class="tab" data-view="favorites">المفضلة ★</button></nav>
<div class="grid">
<section class="panel" id="editor"><h3 id="formTitle">أضف إلى مساحتك</h3><input id="title" class="field" placeholder="عنوان الملاحظة أو المهمة" maxlength="140"><textarea id="bodyText" class="field" placeholder="اكتب فكرتك هنا..."></textarea><label style="display:flex;align-items:center;gap:8px;margin:4px 0 12px"><input type="checkbox" id="isTask"> هذه مهمة قابلة للإنجاز</label><button id="save">حفظ في مساحتي</button> <button id="cancel" class="secondary hidden">إلغاء التعديل</button><p style="color:var(--muted);font-size:12px;margin-bottom:0">يتم حفظ بياناتك محليًا على هذا الجهاز.</p></section>
<section class="panel"><h3>محتواك</h3><input id="search" class="field search" placeholder="ابحث في ملاحظاتك ومهامك..."><div id="items" class="list"></div></section>
</div>
<div class="footer">مساحتي — أفكارك تستحق مساحة جميلة. <button id="export" class="secondary">تصدير نسخة احتياطية</button> <button id="importBtn" class="secondary">استيراد نسخة</button><input id="importFile" type="file" accept="application/json" class="hidden"></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let data=[];let view='all',editing=null;try{data=JSON.parse(localStorage.getItem('masahati-items-v1')||'[]')}catch{}const persist=()=>{localStorage.setItem('masahati-items-v1',JSON.stringify(data));render()};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){editing=null;$('title').value='';$('bodyText').value='';$('isTask').checked=false;$('formTitle').textContent='أضف إلى مساحتك';$('save').textContent='حفظ في مساحتي';$('cancel').classList.add('hidden')}function render(){const notes=data.filter(x=>!x.task),tasks=data.filter(x=>x.task);$('notesCount').textContent=notes.length;$('tasksCount').textContent=tasks.length;$('doneCount').textContent=tasks.filter(x=>x.done).length;const q=$('search').value.trim().toLowerCase();let rows=data.filter(x=>(view==='all'||view==='notes'&&!x.task||view==='tasks'&&x.task||view==='favorites'&&x.favorite)&&(!q||(x.title+' '+x.body).toLowerCase().includes(q)));$('items').innerHTML=rows.length?rows.map(x=>'<article class="item">'+(x.task?'<input type="checkbox" '+(x.done?'checked':'')+' aria-label="إنجاز المهمة" data-done="'+x.id+'">':'<span style="color:var(--accent)">▤</span>')+'<div class="item-main"><div class="item-title '+(x.done?'done':'')+'">'+esc(x.title||'بدون عنوان')+'</div><small>'+esc(x.body)+'</small><small>'+new Date(x.updated).toLocaleDateString('ar-DZ')+'</small></div><button class="del" title="المفضلة" data-fav="'+x.id+'">'+(x.favorite?'★':'☆')+'</button><button class="del" title="تعديل" data-edit="'+x.id+'">✎</button><button class="del" title="حذف" data-del="'+x.id+'">×</button></article>').join(''):'<div class="empty">لا يوجد محتوى هنا بعد. ابدأ بإضافة فكرة جميلة ✨</div>'}
$('save').onclick=()=>{const title=$('title').value.trim(),body=$('bodyText').value.trim();if(!title&&!body){$('title').focus();return}const old=data.find(x=>x.id===editing);const item={id:editing||Date.now().toString(36)+Math.random().toString(36).slice(2,7),title,body,task:$('isTask').checked,done:old?.done||false,favorite:old?.favorite||false,updated:Date.now()};if(editing)data=data.map(x=>x.id===editing?item:x);else data.unshift(item);reset();persist()};$('cancel').onclick=reset;$('search').oninput=render;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(n=>n.classList.toggle('active',n===b));render()});$('items').onclick=e=>{const b=e.target.closest('button');if(b?.dataset.del){data=data.filter(x=>x.id!==b.dataset.del);persist()}if(b?.dataset.fav){const x=data.find(x=>x.id===b.dataset.fav);x.favorite=!x.favorite;persist()}if(b?.dataset.edit){const x=data.find(x=>x.id===b.dataset.edit);editing=x.id;$('title').value=x.title;$('bodyText').value=x.body;$('isTask').checked=x.task;$('formTitle').textContent='تعديل المحتوى';$('save').textContent='حفظ التعديلات';$('cancel').classList.remove('hidden');$('title').focus()}};$('items').onchange=e=>{if(e.target.dataset.done){const x=data.find(x=>x.id===e.target.dataset.done);x.done=e.target.checked;x.updated=Date.now();persist()}};$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('masahati-dark',document.body.classList.contains('dark'))};if(localStorage.getItem('masahati-dark')==='true')document.body.classList.add('dark');$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Masahati',version:1,items:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='masahati-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const o=JSON.parse(await f.text());const arr=Array.isArray(o)?o:o.items;if(!Array.isArray(arr))throw Error();if(confirm('سيتم استبدال المحتوى الحالي. هل تريد المتابعة؟')){data=arr;persist()}}catch{alert('تعذر قراءة النسخة الاحتياطية.')}e.target.value=''};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));render()})();
</script></body></html>
